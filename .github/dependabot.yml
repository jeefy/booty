version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # vue-tsc 2.x cannot type-check with the TypeScript 7 native compiler yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Track Node LTS (even majors) only.
      - dependency-name: library/node
        versions: ["25", "27", "29"]
