# Booty merges its builtin fragment (hostname, update timer, booted callback, ssh keys)
# and, with --profile=kubeadm-worker, the whole Kubernetes worker setup (CNI plugins,
# kubeadm/kubelet/kubectl/crictl, kubelet units, kubeadm join on every boot, optional
# containerd disk via --containerdDisk) — see the README. This template only has to
# carry what is specific to your site.
#
# SSH keys: pass --sshAuthorizedKeysFile (or --sshAuthorizedKeys) instead of listing
# them here; the sshkeys builtin adds them to the 'core' user.
#
# Anything you define here with the same file path or unit name as a builtin/profile
# entry wins over it (Ignition merge: later entries win).
variant: flatcar
version: 1.1.0
storage:
  files:
    # Site DNS. Drop this block to keep DHCP-provided resolvers.
    - path: /etc/systemd/resolved.conf.d/booty.conf
      mode: 0644
      contents:
        inline: |
          [Resolve]
          DNS=192.168.1.1
          FallbackDNS=1.1.1.1
    # Example of a per-host value: {{ .Hostname }}, {{ .ServerIP }}, {{ .JoinString }}
    # and {{ .OSTreeImage }} are available in every template.
    - path: /etc/motd
      mode: 0644
      contents:
        inline: "{{ .Hostname }} -- PXE booted from Booty at {{ .ServerIP }}\n"
