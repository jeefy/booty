# Booty on the control-plane node of the cluster it PXE-boots workers for.
#
# hostNetwork so TFTP (69/UDP) and HTTP (80/TCP) are reachable from the boot
# VLAN and the ARP fallback works. --profile=kubeadm-worker embeds the whole
# worker setup; --kubeadmJoin=auto mints a short-lived bootstrap token per
# boot through the API (RBAC below), so no join Secret is needed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booty
  namespace: kube-system
---
# Bootstrap tokens live in kube-system: create per boot, list/delete expired ones.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booty-bootstrap-tokens
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "list", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booty-bootstrap-tokens
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: booty
    namespace: kube-system
roleRef:
  kind: Role
  name: booty-bootstrap-tokens
  apiGroup: rbac.authorization.k8s.io
---
# cluster-info carries the external API endpoint and CA for the discovery hash.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: booty-cluster-info
  namespace: kube-public
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-info"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: booty-cluster-info
  namespace: kube-public
subjects:
  - kind: ServiceAccount
    name: booty
    namespace: kube-system
roleRef:
  kind: Role
  name: booty-cluster-info
  apiGroup: rbac.authorization.k8s.io
---
# Site-specific Butane only; hostname, SSH keys, update timer and the whole
# kubeadm worker setup come from Booty itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: booty-config
  namespace: kube-system
data:
  ignition.yaml: |
    variant: flatcar
    version: 1.1.0
    storage:
      files:
        - path: /etc/systemd/resolved.conf.d/booty.conf
          mode: 0644
          contents:
            inline: |
              [Resolve]
              DNS=192.168.1.1
---
# SSH public keys for the 'core' user, one per line (--sshAuthorizedKeysFile).
apiVersion: v1
kind: Secret
metadata:
  name: booty-ssh-keys
  namespace: kube-system
type: Opaque
stringData:
  authorized_keys: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... you@laptop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booty
  namespace: kube-system
  labels:
    app: booty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: booty
  template:
    metadata:
      labels:
        app: booty
    spec:
      serviceAccountName: booty
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: booty
          image: ghcr.io/jeefy/booty:main
          imagePullPolicy: Always
          args:
            - --dataDir=/data
            - --httpPort=80
            # The address booting machines reach Booty on: the node IP with
            # hostNetwork, or the MetalLB VIP below if you route through it.
            - --serverIP=192.168.1.10
            - --profile=kubeadm-worker
            - --kubeadmJoin=auto
            # - --containerdDisk=/dev/sda   # wipe+mount an ephemeral disk at /var/lib/containerd
            # - --k8sVersion=v1.34.3
            # - --cniVersion=v1.1.1
            - --sshAuthorizedKeysFile=/etc/booty/ssh/authorized_keys
          ports:
            - name: tftp
              containerPort: 69
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "NET_RAW"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: booty-config
              mountPath: /data/config
              readOnly: true
            - name: booty-ssh-keys
              mountPath: /etc/booty/ssh
              readOnly: true
            - name: booty-data
              mountPath: /data
      volumes:
        - name: booty-config
          configMap:
            name: booty-config
        - name: booty-ssh-keys
          secret:
            secretName: booty-ssh-keys
        - name: booty-data
          persistentVolumeClaim:
            claimName: booty-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booty-data
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Optional: a stable VIP in front of the pod (MetalLB). Both Services share
# one IP; set --serverIP to it.
apiVersion: v1
kind: Service
metadata:
  name: booty-tcp
  namespace: kube-system
  labels:
    app: booty
  annotations:
    metallb.universe.tf/allow-shared-ip: booty-svc
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.50.20
  externalTrafficPolicy: Local
  selector:
    app: booty
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: booty-udp
  namespace: kube-system
  labels:
    app: booty
  annotations:
    metallb.universe.tf/allow-shared-ip: booty-svc
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.50.20
  externalTrafficPolicy: Local
  selector:
    app: booty
  ports:
    - name: tftp
      port: 69
      protocol: UDP
      targetPort: 69
